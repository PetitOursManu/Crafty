# Filtre fail2ban pour Crafty : /etc/fail2ban/filter.d/crafty.conf
#
# Lit le journal de connexion écrit par src/log.js dans DATA_DIR/logs/auth.log (aussi sur la sortie du conteneur) :
#   2026-11-14T10:00:00.000Z craft-host AUTH_FAIL ip=203.0.113.7 user="bob" reason=password
#   2026-11-14T10:00:00.000Z craft-host AUTH_LOCKED ip=203.0.113.7 user="bob"
#   2026-11-14T10:00:00.000Z craft-host AUTH_RATELIMIT ip=203.0.113.7 user="bob"
#   2026-11-14T10:00:00.000Z craft-host AUTH_OK ip=203.0.113.7 user="bob"
# Comptent : échec (mot de passe, code de double authentification, SSO refusé), compte verrouillé, limite par IP atteinte.
# Si le format change dans src/log.js, ce fichier change avec lui (test : deploy/fail2ban/README.md).

[Definition]

# fail2ban retire la date trouvée par datepattern avant d'appliquer failregex : le motif s'ancre sur le message (^.*),
# pas sur ce qui le précède (date seule dans auth.log, date + préfixe Docker ou journald sur la sortie du conteneur).
failregex = ^.*craft-host AUTH_(?:FAIL|LOCKED|RATELIMIT) ip=<HOST> user="[^"]*"(?: reason=\S+)?\s*$

ignoreregex = ^.*craft-host AUTH_OK ip=<HOST>

datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S(?:\.%%f)?Z
