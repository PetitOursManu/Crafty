<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Craft</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="/host.css">
  <script type="module" src="/host.js"></script>
</head>
<body>
  <header class="hostbar">
    <a class="btn icon ghost" id="back" href="/" title="Retour à mes fichiers" aria-label="Retour à mes fichiers"></a>
    <span id="appTile"></span>
    <div class="doc">
      <div class="doc-name" id="docName">Chargement…</div>
      <div class="doc-path" id="docPath"></div>
    </div>
    <span id="status" class="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusText"></span></span>
    <div class="spacer"></div>
    <label class="btn sm" id="localOpen" hidden><span>Ouvrir un fichier de l'ordinateur</span><input type="file" id="localFile" hidden></label>
    <div id="account"></div>
  </header>
  <main class="host-main">
    <div class="frame-wrap">
      <iframe id="app" title="Application" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
      <div id="loading" class="loading"><div class="spinner" aria-hidden="true"></div><span id="loadingText">Chargement de l'application…</span></div>
    </div>
    <aside id="debug" class="debug" hidden>
      <div class="debug-bar"><strong>Journal (débogage)</strong>
        <label class="check"><input type="checkbox" id="simFail"> simuler un échec</label>
        <button class="btn sm" id="clearLog" type="button">effacer</button></div>
      <ol id="log"></ol>
    </aside>
  </main>
</body>
</html>
